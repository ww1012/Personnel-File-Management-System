# 示例文件：复制为 application-mysql.yml 后填写本机数据库信息。
# application-mysql.yml 已在 .gitignore 中，禁止提交密码或真实连接地址。
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/personnel_management?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: YOUR_DATABASE_USERNAME
    password: YOUR_DATABASE_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
app:
  storage:
    mode: mysql
