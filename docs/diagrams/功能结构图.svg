<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="'Microsoft YaHei','SimHei',sans-serif">
  <style>
    .edge{stroke:#555;stroke-width:1.4;fill:none}
    .root{fill:#1f4e79}
    .branch{fill:#2e75b6}
    .mod{fill:#dce6f1;stroke:#2e75b6;stroke-width:1.4}
    .leaf{fill:#eaf1fb;stroke:#8faadc;stroke-width:1.2}
    .t{fill:#fff;text-anchor:middle;font-size:18px;font-weight:700}
    .mt{fill:#13315c;text-anchor:middle;font-size:15px;font-weight:700}
    .ms{fill:#33485f;text-anchor:middle;font-size:11px}
    .lt{fill:#13315c;text-anchor:middle;font-size:14px;font-weight:700}
    .ls{fill:#33485f;text-anchor:middle;font-size:11px}
  </style>

  <!-- edges root -> branch -->
  <path class="edge" d="M480,78 C480,110 150,120 150,148"/>
  <path class="edge" d="M480,78 L480,148"/>
  <path class="edge" d="M480,78 C480,110 810,120 810,148"/>

  <!-- edges admin -> modules -->
  <path class="edge" d="M500,198 L340,278"/>
  <path class="edge" d="M500,198 L520,278"/>
  <path class="edge" d="M500,198 L700,278"/>
  <path class="edge" d="M500,198 L430,368"/>
  <path class="edge" d="M500,198 L610,368"/>

  <!-- edges branch -> leaves -->
  <path class="edge" d="M140,198 L140,278"/>
  <path class="edge" d="M860,198 L860,278"/>

  <!-- root -->
  <rect class="root" x="370" y="30" width="220" height="48" rx="8"/>
  <text class="t" x="480" y="60">人事管理系统</text>

  <!-- branch -->
  <rect class="branch" x="50" y="148" width="180" height="50" rx="8"/>
  <text class="t" x="140" y="179">认证与会话</text>
  <rect class="branch" x="400" y="148" width="200" height="50" rx="8"/>
  <text class="t" x="500" y="179">管理员功能</text>
  <rect class="branch" x="770" y="148" width="180" height="50" rx="8"/>
  <text class="t" x="860" y="179">职员功能</text>

  <!-- 认证 leaf -->
  <rect class="leaf" x="60" y="278" width="160" height="92" rx="6"/>
  <text class="lt" x="140" y="304">登录 / 退出</text>
  <text class="ls" x="140" y="326">修改密码（BCrypt 哈希）</text>
  <text class="ls" x="140" y="346">凭证失效（退出/停用/改密）</text>
  <text class="ls" x="140" y="362">未登录 401 / 越权 403</text>

  <!-- 职员 leaf -->
  <rect class="leaf" x="780" y="278" width="160" height="92" rx="6"/>
  <text class="lt" x="860" y="304">我的资料</text>
  <text class="ls" x="860" y="326">仅查看本人档案</text>
  <text class="ls" x="860" y="346">编辑手机号/邮箱/</text>
  <text class="ls" x="860" y="362">地址/学历（仅本人）</text>

  <!-- admin modules (top row 3) -->
  <rect class="mod" x="250" y="278" width="180" height="74" rx="6"/>
  <text class="mt" x="340" y="302">工作台统计</text>
  <text class="ms" x="340" y="322">员工/离职/部门/岗位计数</text>
  <text class="ms" x="340" y="338">部门人数分布（扇形图）</text>
  <text class="ms" x="340" y="354">近期人事变动</text>

  <rect class="mod" x="430" y="278" width="180" height="74" rx="6"/>
  <text class="mt" x="520" y="302">员工管理</text>
  <text class="ms" x="520" y="322">查询/筛选/分页</text>
  <text class="ms" x="520" y="338">新增·详情·编辑</text>
  <text class="ms" x="520" y="354">调岗·离职（专用流程）</text>

  <rect class="mod" x="610" y="278" width="180" height="74" rx="6"/>
  <text class="mt" x="700" y="302">部门与岗位管理</text>
  <text class="ms" x="700" y="322">部门增删改查</text>
  <text class="ms" x="700" y="338">岗位增删改查</text>
  <text class="ms" x="700" y="354">按部门过滤（联动）</text>

  <!-- admin modules (bottom row 2) -->
  <rect class="mod" x="340" y="368" width="180" height="74" rx="6"/>
  <text class="mt" x="430" y="392">人事变动记录</text>
  <text class="ms" x="430" y="412">入职/调岗/离职查询</text>
  <text class="ms" x="430" y="428">变动前后快照</text>
  <text class="ms" x="430" y="444">按时间倒序·只读</text>

  <rect class="mod" x="520" y="368" width="180" height="74" rx="6"/>
  <text class="mt" x="610" y="392">职员账号管理</text>
  <text class="ms" x="610" y="412">创建·关联员工</text>
  <text class="ms" x="610" y="428">停用·重置密码</text>
  <text class="ms" x="610" y="444">失效旧凭证</text>

  <text x="500" y="500" text-anchor="middle" font-size="12" fill="#888">说明：角色仅 ADMIN / EMPLOYEE，由后端账号决定；权限校验以后端为准，前端仅作体验控制。</text>
  <text x="500" y="520" text-anchor="middle" font-size="12" fill="#888">实现版「岗位」已归属部门（departmentId），用于调岗时岗位随部门联动（与需求说明原始约定略有差异）。</text>
</svg>
